[project]
name = "rp-engine"
version = "3.0.0"
description = "TKG RP Engine — unified async Python game engine"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "flask>=3.0",
    "psycopg2-binary>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
